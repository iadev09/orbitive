[package]
name = "orbit-pool"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Fleet-wide resource leases, reservations and creation claims over Orbit shared memory."
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/orbit-pool"
keywords = ["pool", "shm", "fleet", "orbit", "ring"]
exclude.workspace = true

[dependencies]
orbit-core.workspace = true

[dev-dependencies]
orbit-stream = { workspace = true, features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "io-util", "time"] }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[[bench]]
name = "load"
harness = false
