[package]
name = "orbit-link"
version = "0.5.3"
publish.workspace = true
edition.workspace = true
authors.workspace = true
description = "Named reusable duplex sessions between members of an Orbit fleet."
keywords = ["ipc", "session", "shared-memory", "fleet", "stream"]
categories = ["asynchronous", "concurrency"]
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/orbit-link"
exclude.workspace = true

[features]
tokio = ["orbit-stream/tokio", "dep:tokio"]
# Carry fleet events between two fleets meeting in a link segment. Never
# implied by enabling the link and the event bus separately.
events = ["tokio", "dep:orbit-events"]

[dependencies]
orbit-core.workspace = true
orbit-stream.workspace = true
orbit-events = { workspace = true, optional = true }
tokio = { version = "1", default-features = false, features = ["net", "rt"], optional = true }
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[[bench]]
name = "dispatch"
harness = false
