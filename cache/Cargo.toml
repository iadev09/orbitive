[package]
name = "orbit-cache"
version = "0.5.6"
publish.workspace = true
edition.workspace = true
authors.workspace = true
description = "Fleet-coherent local cache over Orbit shared-memory rings."
license.workspace = true
repository.workspace = true
keywords = ["cache", "shm", "fleet", "orbit", "ring"]
categories = ["caching", "concurrency"]
exclude.workspace = true

[features]
arena-timing = ["orbit-arena/bench-timing"]

[dependencies]
blake3.workspace = true
bytes.workspace = true
lru.workspace = true
orbit-core.workspace = true
orbit-arena.workspace = true

[dev-dependencies]
criterion.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[[bench]]
name = "replicated_write"
harness = false

[[bench]]
name = "get"
harness = false

[[bench]]
name = "fleet_write"
harness = false
