[package]
name = "orbitive"
version = "0.4.1"
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["shared-memory", "ipc", "concurrency", "runtime", "fleet"]
categories = ["concurrency", "data-structures"]
documentation = "https://docs.rs/orbitive"
exclude.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
cache = ["dep:orbit-cache"]
lock = ["dep:orbit-lock"]
events = ["dep:orbit-events"]
counter = ["dep:orbit-counter"]
cell = ["dep:orbit-cell"]
arena = ["dep:orbit-arena"]
invoke = ["dep:orbit-invoke"]
invoke-tokio = ["invoke", "orbit-invoke?/tokio"]
metrics = ["dep:orbit-metrics"]
rustls = ["rustls_0_23"]
stream = ["dep:orbit-stream"]
stream-tokio = ["stream", "orbit-stream?/tokio"]
pool = ["dep:orbit-pool"]
pool-stream = ["pool", "stream", "orbit-pool?/pool-stream"]
rustls_0_23 = ["dep:orbit-rustls", "orbit-rustls/rustls_0_23"]
rustls_0_24 = ["dep:orbit-rustls", "orbit-rustls/rustls_0_24"]
full = [
    "arena",
    "cache",
    "cell",
    "events",
    "counter",
    "invoke",
    "metrics",
    "lock",
    "rustls",
    "stream",
    "stream-tokio",
    "pool",
]

[dependencies]
orbit-core.workspace = true
orbit-arena = { workspace = true, optional = true }
orbit-cache = { workspace = true, optional = true }
orbit-lock = { workspace = true, optional = true }
orbit-events = { workspace = true, optional = true }
orbit-counter = { workspace = true, optional = true }
orbit-cell = { workspace = true, optional = true }
orbit-invoke = { workspace = true, optional = true }
orbit-metrics = { workspace = true, optional = true }
orbit-pool = { workspace = true, optional = true }
orbit-rustls = { workspace = true, optional = true }
orbit-stream = { workspace = true, optional = true }

[workspace]
members = [
    "arena",
    "cache",
    "cli",
    "counter",
    "cell",
    "events",
    "invoke",
    "lock",
    "rustls",
    "core",
    "metrics",
    "stream",
    "pool",
]
resolver = "3"


[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["ilker Arabaci <iarabaci@claviron.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/iadev09/orbitive"
description = "Bounded same-host runtime state for process fleets."
exclude = [
    "ARCHITECTURE.md",
    "*.local.md",
    "FINDINGS.md",
    "VISION.md",
    "Dockerfile",
    "Justfile",
]

[workspace.dependencies]
orbit-core = { version = "0.4.1", path = "core", default-features = false }
orbit-cache = { version = "0.4.0", path = "cache", default-features = false }
orbit-lock = { version = "0.4.0", path = "lock", default-features = false }
orbit-events = { version = "0.4.0", path = "events", default-features = false }
orbit-counter = { version = "0.4.0", path = "counter", default-features = false }
orbit-cell = { version = "0.4.1", path = "cell", default-features = false }
orbit-arena = { version = "0.4.0", path = "arena", default-features = false }
orbit-invoke = { version = "0.4.0", path = "invoke", default-features = false }
orbit-metrics = { version = "0.4.0", path = "metrics", default-features = false }
orbit-pool = { version = "0.4.1", path = "pool", default-features = false}
orbit-stream = { version = "0.4.0", path = "stream", default-features = false }
orbit-rustls = { version = "0.4.0", path = "rustls", default-features = false }

bytes = "1.11"
criterion = "0.8.2"
dashmap = "6.1"
libc = "0.2"
lru = "0.18"
netid64 = "0.1.1"
nix = { version = "0.31", features = ["process", "signal", "user", "fs"] }
rustls_0_23 = { package = "rustls", version = "0.23", default-features = false, features = ["std"] }
rustls_0_24 = { package = "rustls", version = "0.24.0-dev.1", default-features = false }
tracing = "0.1.44"
