<svg xmlns="http://www.w3.org/2000/svg" width="640" height="170" viewBox="0 0 640 170" role="img" aria-label="Orbitive">
  <defs>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94A3B8" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#64748B" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#94A3B8" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- A small fleet sharing one center through independent orbits. -->
  <g fill="none" stroke="url(#orbit)" stroke-width="2">
    <ellipse cx="105" cy="85" rx="61" ry="25" transform="rotate(-18 105 85)"/>
    <ellipse cx="105" cy="85" rx="55" ry="22" transform="rotate(57 105 85)"/>
  </g>

  <circle cx="105" cy="85" r="5" fill="#64748B"/>
  <circle cx="159" cy="66" r="7" fill="#D97706"/>
  <circle cx="66" cy="115" r="4" fill="#94A3B8"/>

  <text x="190" y="105" textLength="340" lengthAdjust="spacing"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="60" fill="#64748B">orbitive</text>
</svg>
