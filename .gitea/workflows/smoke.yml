name: orbit-smoke

on:
  workflow_dispatch:
  push:

jobs:
  native-arm64:
    runs-on: rust-ci-native
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Orbit smoke test
        run: just smoke

  freebsd:
    name: FreeBSD
    runs-on: FreeBSD
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: FreeBSD smoke test
        run: |
          if [ "$(uname -s)" = "FreeBSD" ]; then
            just smoke-freebsd
          else
            test "${CARGO_BUILD_TARGET:-}" = "x86_64-unknown-freebsd"
            cargo build --workspace --all-targets --locked
          fi
