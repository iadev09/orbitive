name: orbit-smoke

on:
  workflow_dispatch:
  push:

jobs:
  linux:
    name: Linux
    runs-on: linux
    container:
      # Parallel arena tests can populate several default 64 MiB segments.
      options: --shm-size=1g
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Orbit smoke test
        run: just smoke-linux
      - name: Each package without default features
        run: just features

  # Data races run from race.yml, only when the shared-memory code changes.

  freebsd:
    name: FreeBSD
    runs-on: FreeBSD
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: FreeBSD smoke test
        run: just smoke-freebsd
