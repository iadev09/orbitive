name: orbit-smoke

on:
  workflow_dispatch:
  push:

jobs:
  linux:
    name: Linux
    runs-on: linux
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Orbit smoke test
        run: just smoke-linux

  # The substrate's `unsafe` is several processes and several threads over the
  # same mapped bytes, and a plain test run cannot tell a correct seqlock from
  # an undefined one — both work on the hardware we ship on. This job is the
  # one that can. Linux only: ThreadSanitizer is not available on FreeBSD.
  race:
    name: Data races
    runs-on: linux
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Nightly toolchain with rust-src
        run: rustup toolchain install nightly --component rust-src --profile minimal
      - name: ThreadSanitizer
        run: just race

  freebsd:
    name: FreeBSD
    runs-on: freebsd
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: FreeBSD smoke test
        run: just smoke-freebsd
