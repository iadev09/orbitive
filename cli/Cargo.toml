[package]
name = "orbitive-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["ilker Arabaci <iarabaci@claviron.dev>"]
description = "Inspect and remove Orbit POSIX shared-memory objects."
license = "MIT OR Apache-2.0"
repository = "https://github.com/iadev09/orbitive"
keywords = ["shared-memory", "ipc", "cli", "posix", "orbit"]
categories = ["command-line-utilities", "development-tools::debugging"]
exclude = ["ARCHITECTURE.md", "*.local.md"]

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
orbit-core = { version = "0.3.0", path = "../core", default-features = false }
