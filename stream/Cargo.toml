[package]
name = "orbit-stream"
version.workspace = true
publish.workspace = true
edition.workspace = true
authors.workspace = true
description = "Bounded byte streams and paired exchanges over shared memory for process fleets."
keywords = ["async", "stream", "shared-memory", "ipc", "fleet"]
categories = ["asynchronous", "concurrency"]
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/orbit-stream"
exclude.workspace = true

[features]
# `AsyncRead` / `AsyncWrite` on the halves, with the doorbell answered on the
# runtime through a named Unix datagram socket (`src/bell.rs`).
tokio = ["dep:tokio", "tokio/net"]

[dependencies]
bytes.workspace = true
orbit-core.workspace = true
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }


[dev-dependencies]
criterion.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[[bench]]
name = "transport"
harness = false
required-features = ["tokio"]
