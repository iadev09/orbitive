[package]
name = "orbit-stream"
# Alpha on its own track: the crate works, but what it is for is still
# being decided, and a pre-release says that where a README cannot --
# `cargo add orbit-stream` will not pick it up by accident.
version = "0.4.0-alpha.1"
edition.workspace = true
authors.workspace = true
description = "Bounded byte streams and paired exchanges over shared memory for process fleets."
keywords = ["async", "stream", "shared-memory", "ipc", "fleet"]
categories = ["asynchronous", "concurrency"]
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/orbit-stream"
exclude.workspace = true

[features]
tokio = ["dep:tokio"]

[dependencies]
bytes.workspace = true
orbit-core.workspace = true
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }


[dev-dependencies]
criterion.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "time"] }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[[bench]]
name = "transport"
harness = false
required-features = ["tokio"]

[[bench]]
name = "fleet"
harness = false
required-features = ["tokio"]

[[bench]]
name = "phase2"
harness = false
required-features = ["tokio"]
